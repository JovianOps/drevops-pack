name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t drevops-pack:ci .

      - name: Smoke test — doctor
        run: docker run --rm drevops-pack:ci drevops doctor

      - name: Smoke test — list
        run: docker run --rm drevops-pack:ci drevops list

      - name: Smoke test — version
        run: docker run --rm drevops-pack:ci drevops version

  publish:
    name: Publish to GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jovianops/drevops-pack:latest
          labels: |
            org.opencontainers.image.title=drevops-pack
            org.opencontainers.image.description=All DrevOps tools in one Docker image
            org.opencontainers.image.license=MIT
            org.opencontainers.image.source=https://github.com/JovianOps/drevops-pack
